<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجموعة MCI · MCI Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* MCI Group design system v2
   Derived from the MCI Group mark: four colour quadrants of rounded squares
   arranged around a cross. Approved platform colours:
   Cyan (top left) = MCI Academy, Purple (top right) = MCI Medical,
   Green (bottom left) = MCI Career, Orange (bottom right) = MCI Research.
   Blue + navy carry the Group itself. */

:root{
  --navy-950:#0B2A50; --navy-900:#143256; --navy-800:#1A3D66; --navy-700:#24476F; --navy-600:#2F5580;
  --ink:#0B2A50; --ink-2:#3A4A5E; --ink-3:#5B6676; --ink-4:#8A97A8;
  --line:#E2E8F0; --line-2:#EDF1F6; --bg:#F5F7FA; --bg-2:#EEF2F7; --white:#FFFFFF;

  --blue:#1256A2; --blue-600:#0E4785; --blue-tint:#E8EFF8;
  --cyan:#22A4D2;   --cyan-ink:#19799B;   --cyan-tint:#E9F6FA;
  --purple:#723DBD; --purple-ink:#723DBD; --purple-tint:#F1ECF8;
  --green:#74AC2C;  --green-ink:#547C20;  --green-tint:#F1F7EA;
  --orange:#F89A1C; --orange-ink:#9F6312; --orange-tint:#FEF5E8;

  --ok:#187A42;   --ok-tint:#E5F4EB;
  --warn:#8F5600; --warn-tint:#FDF1DC;
  --bad:#C0352B;  --bad-tint:#FBE8E6;

  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:26px;
  --shadow:0 1px 2px rgba(14,27,44,.04),0 10px 28px -14px rgba(14,27,44,.14);
  --shadow-lg:0 2px 4px rgba(14,27,44,.05),0 22px 48px -18px rgba(14,27,44,.24);
  --font:"IBM Plex Sans Arabic","Montserrat",system-ui,sans-serif;
  --font-num:"Montserrat","IBM Plex Sans Arabic",system-ui,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.65}
a{color:var(--blue);text-decoration:none}
a:hover{color:var(--blue-600)}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* type */
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.h-display{font-weight:700;font-size:clamp(38px,5.2vw,68px);line-height:1.18;letter-spacing:-.01em}
.h2{font-weight:700;font-size:clamp(28px,3.2vw,42px);line-height:1.3}
.h3{font-weight:600;font-size:20px;line-height:1.45}
.lead{font-size:clamp(16px,1.4vw,19px);color:var(--ink-2);line-height:1.9}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:600 13px/1.2 var(--font);color:var(--blue);letter-spacing:.02em}
.eyebrow.onDark{color:#4EB6DB}

/* layout */
.wrap{width:100%;max-width:1280px;margin-inline:auto;padding-inline:clamp(16px,4vw,48px)}
.section{padding-block:clamp(64px,8vw,112px)}
.grid-bg{background-color:var(--navy-900);background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:56px 56px}

/* brand glyph: the mark reduced to four squares (always LTR so cyan stays top-left) */
.glyph{display:inline-grid;grid-template-columns:repeat(2,7px);gap:2px;direction:ltr;flex:none}
.glyph i{display:block;width:7px;height:7px;border-radius:2px}
.glyph i:nth-child(1){background:var(--cyan)}
.glyph i:nth-child(2){background:var(--purple)}
.glyph i:nth-child(3){background:var(--green)}
.glyph i:nth-child(4){background:var(--orange)}
.sq{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:12px;font:600 15px/1 var(--font);border:1px solid transparent;cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .2s;white-space:nowrap}
.btn svg{flex:none}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-600);color:#fff}
.btn-outline{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-outline:hover{border-color:#C3CEDC;color:var(--ink);background:#FBFCFE}
.btn-light{background:#fff;color:var(--navy-900)}
.btn-light:hover{background:#E9F1FA;color:var(--navy-900)}
.btn-ghost-dark{border-color:rgba(255,255,255,.24);color:#fff}
.btn-ghost-dark:hover{background:rgba(255,255,255,.07);color:#fff}
.btn-sm{min-height:38px;padding:0 14px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink-2);cursor:pointer}
.icon-btn:hover{color:var(--ink);border-color:#C3CEDC}
.link-arrow{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}

/* surfaces */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg)}
.lift{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.lift:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#D5DDE8}
.divider{height:1px;background:var(--line);border:0;margin:0}

/* status + tags */
.pill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;font:600 12px/1 var(--font);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-tint);color:var(--ok)}
.pill.warn{background:var(--warn-tint);color:var(--warn)}
.pill.bad{background:var(--bad-tint);color:var(--bad)}
.pill.neutral{background:var(--bg-2);color:var(--ink-2)}
.pill.info{background:var(--blue-tint);color:var(--blue)}
.pill.plain::before{display:none}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;font:600 11px/1 var(--font);background:var(--bg-2);color:var(--ink-2);white-space:nowrap}
.demo-tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:7px;font:600 11px/1 var(--font);background:var(--orange-tint);color:var(--orange-ink);border:1px dashed #E9C27A;white-space:nowrap}

/* KPI */
.kpi-label{font-size:13px;color:var(--ink-3);font-weight:500;line-height:1.4}
.kpi-val{font-family:var(--font-num);font-weight:600;font-size:30px;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi-val.lg{font-size:40px}
.kpi-val.sm{font-size:22px}
.delta{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--font-num);direction:ltr}
.delta.up{color:var(--ok)}
.delta.down{color:var(--bad)}
.track{height:6px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.track>span{display:block;height:100%;border-radius:99px}

/* tables + lists */
.tbl-box{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.tbl th{text-align:start;font-weight:600;color:var(--ink-3);font-size:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:#FAFBFD;white-space:nowrap}
.tbl td{padding:14px 18px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.feed-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.feed-item:last-child{border-bottom:0}

/* forms */
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input{width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:15px var(--font);background:#fff;color:var(--ink)}
textarea.input{padding:14px;min-height:140px;resize:vertical;line-height:1.7}
select.input{appearance:auto}
.input:focus{outline:2px solid var(--blue);outline-offset:0;border-color:transparent}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2)}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--blue)}

/* public nav */
.nav-link{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;font-size:15px;font-weight:500;color:#C6D3E3;border-bottom:2px solid transparent}
.nav-link:hover{color:#fff}
.nav-link.active{color:#fff;border-bottom-color:#4EB6DB}

/* admin shell */
.shell{display:flex;flex-wrap:wrap;min-height:100vh;background:var(--bg)}
.shell-side{flex:1 1 100%;background:var(--navy-900);color:#C9D5E4}
.shell-main{flex:999 1 560px;min-width:0}
@media (min-width:1000px){.shell-side{flex:0 0 272px}}
.nav-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:10px;color:#B5C3D5;font-size:14px;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.active{background:rgba(255,255,255,.1);color:#fff}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:#7F92AB;padding:0 14px;margin:22px 0 8px}

/* gateway */
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;font:600 13px/1 var(--font);cursor:pointer;background:#fff;color:var(--ink-2);border:1px solid var(--line)}
.chip:hover{border-color:#C3CEDC;color:var(--ink)}
.chip .count{font-family:var(--font-num);font-size:12px;padding:3px 7px;border-radius:999px;background:var(--bg-2);color:var(--ink-2)}
.sim-banner{background-image:repeating-linear-gradient(135deg,#FEF5E8 0 12px,#FCEBCB 12px 24px);color:#6F4204;border:1px dashed #E0B567}
.row-btn{display:grid;width:100%;align-items:center;gap:12px;padding:14px 18px;border:0;border-bottom:1px solid var(--line-2);background:#fff;font:14px/1.5 var(--font);color:var(--ink);text-align:start;cursor:pointer}
.row-btn:hover{background:#F8FAFC}
.row-btn:last-child{border-bottom:0}
.link-btn{background:none;border:0;padding:0;font:inherit;color:var(--blue);cursor:pointer;font-weight:600}
.link-btn:hover{color:var(--blue-600);text-decoration:underline}
@keyframes mci-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.load-bar{transform-origin:left center;animation:mci-bar .9s ease-out both}

/* responsive helpers */
@media (max-width:1000px){.hide-md{display:none!important}}
@media (max-width:760px){.hide-sm{display:none!important}}
.show-md{display:none!important}
@media (max-width:1000px){.show-md{display:inline-flex!important}}

/* motion */
@keyframes mci-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes mci-pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
.reveal{animation:mci-up .8s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* MCI Group public page: an animated presentation stage followed by a short page.
   The stage is a fixed composition area. Its elements (four platform cards, the Group
   logo, a focus ring and the text panels) are repositioned between six steps.
   Everything is real markup; all motion is CSS transitions driven by the current step. */

.site{--site-max:1440px;--gutter:clamp(18px,4.6vw,80px);--head:76px;--ease:cubic-bezier(.65,0,.35,1);--ease-out:cubic-bezier(.2,.7,.2,1);overflow-x:clip}
.site .container{width:100%;max-width:var(--site-max);margin-inline:auto;padding-inline:var(--gutter)}
.site section[id]{scroll-margin-top:var(--head)}

/* header */
.site-head{position:sticky;top:0;z-index:30;background:rgba(20,50,86,.94);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid rgba(255,255,255,.08)}
.site-nav-link{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 2px;font-size:15px;font-weight:500;color:#B9C7D8;transition:color .25s}
.site-nav-link:hover{color:#fff}
.site-nav-link::after{content:"";position:absolute;inset-inline:0;bottom:6px;height:2px;border-radius:2px;background:#4EB6DB;transform:scaleX(0);transition:transform .35s var(--ease-out)}
.site-nav-link.on{color:#fff}
.site-nav-link.on::after{transform:scaleX(1)}

/* ---------- STAGE ---------- */
.stage-sec{position:relative;padding-block:clamp(20px,3vh,40px) clamp(24px,3.4vh,44px);color:#fff}
/* the stage keeps a 16:9 composition area but grows when its text needs more room, so nothing is clipped */
.stage{position:relative;margin-inline:auto;width:min(100%,1360px,max(1040px,calc((100svh - 210px) * 16 / 9)));aspect-ratio:16/9;direction:ltr;display:flow-root}
.stage-visual{position:absolute;left:0;top:0;width:100%;aspect-ratio:16/9;direction:ltr}
.stage-visual > *{position:absolute}

/* moving parts share one motion language */
.mv{transition:left .95s var(--ease),top .95s var(--ease),width .95s var(--ease),opacity .7s ease,transform .95s var(--ease)}

/* focus ring */
.ring{aspect-ratio:1/1;border-radius:50%;border:2px solid var(--rc,rgba(255,255,255,.12));box-shadow:0 0 0 18px var(--rg,rgba(255,255,255,.02)),0 0 0 42px var(--rg2,rgba(255,255,255,.012));pointer-events:none;transition:left .95s var(--ease),top .95s var(--ease),width .95s var(--ease),border-color .7s ease,box-shadow .7s ease}

/* group logo (sized by its own width so proportions hold at any scale) */
.glogo{pointer-events:none}
.glogo img{display:block;width:100%;height:auto}

/* the mark, as live cells */
.mark{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));direction:ltr}
.mark .quad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:5%}
.mark .cell{box-sizing:border-box;aspect-ratio:1/1;padding:9%}
.mark .cell i{display:block;width:100%;height:100%;border-radius:22%;background:var(--c)}

/* platform portrait cards (buttons) */
.pcard{container-type:inline-size;aspect-ratio:3/4;border:0;padding:0;margin:0;cursor:pointer;border-radius:9% / 6.75%;background:var(--pc);color:var(--pt);font-family:inherit;text-align:start;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.6);outline-offset:4px}
.pcard:focus-visible{outline:3px solid #fff}
.pcard .pc-in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:9cqw}
.pcard .pc-pat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5cqw;width:72%;direction:ltr}
.pcard .pc-pat s{display:block;aspect-ratio:1/1;border-radius:22%;background:var(--pt);opacity:.2;transform:scale(.7);transition:transform .7s var(--ease-out),opacity .7s ease;transition-delay:var(--d,0ms)}
.pcard .pc-pat s.off{visibility:hidden}
.pcard.focus .pc-pat s{opacity:.32;transform:none}
.pcard .pc-text{display:flex;flex-direction:column;gap:3cqw;transition:opacity .5s ease}
.pcard .pc-num{font-family:"Montserrat",sans-serif;font-weight:600;font-size:7cqw;opacity:.75}
.pcard .pc-name{font-weight:700;font-size:10.5cqw;line-height:1.2}
.pcard .pc-tag{font-weight:500;font-size:5.8cqw;line-height:1.45;opacity:.85}
.pcard.compact .pc-text{opacity:0}
.pcard.compact .pc-pat{width:100%}
.pcard:hover{filter:brightness(1.05)}

/* text panels: all panels share one grid cell, so the box never jumps */
.stage-text{position:relative;display:grid;padding-bottom:28px;transition:margin-left .95s var(--ease),margin-top .95s var(--ease),width .95s var(--ease)}
.spanel{grid-area:1/1;display:flex;flex-direction:column;gap:18px;visibility:hidden;transition:visibility 0s linear .6s}
.spanel.on{visibility:visible;transition-delay:0s}
.spanel.center{align-items:center;text-align:center}
/* masked line reveal: once shown, the clip opens past the edges so nothing (focus rings, descenders) is cut */
.mk{display:block}
.mk > *{display:block;transform:translateY(45%);opacity:0;clip-path:inset(0 0 100% 0);transition:transform .55s var(--ease),opacity .4s ease,clip-path .55s var(--ease)}
.spanel.on .mk > *{transform:none;opacity:1;clip-path:inset(-16px -16px -16px -16px);transition:transform .9s var(--ease-out),opacity .6s ease,clip-path .9s var(--ease-out)}
.spanel.on .s1 > *{transition-delay:.32s}.spanel.on .s2 > *{transition-delay:.42s}.spanel.on .s3 > *{transition-delay:.52s}
.spanel.on .s4 > *{transition-delay:.62s}.spanel.on .s5 > *{transition-delay:.72s}.spanel.on .s6 > *{transition-delay:.82s}

.st-kicker{display:inline-flex !important;align-items:center;gap:10px;font-size:14px;font-weight:600;letter-spacing:.02em}
.st-h{font-weight:700;font-size:clamp(34px,3.4vw,56px);line-height:1.14;letter-spacing:-.01em;margin:0}
.st-h.xl{font-size:clamp(34px,3.5vw,58px)}
.spanel.center .st-h{font-size:clamp(28px,2.7vw,44px)}
.st-tag{font-size:clamp(16px,1.3vw,19px);font-weight:600}
.st-p{font-size:clamp(16px,1.2vw,18px);line-height:1.85;color:#C2D0E1;margin:0;max-width:640px}
.st-pills{display:flex !important;flex-wrap:wrap;gap:8px}
.st-pills li{padding:7px 12px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:13px;font-weight:500;color:#E3EBF5}
.st-actions{display:flex !important;flex-wrap:wrap;gap:12px;align-items:center}
.spanel.center .st-actions,.spanel.center .st-pills{justify-content:center}
.st-actions .btn{white-space:normal;text-align:center;line-height:1.4;padding-block:12px;max-width:100%}

/* approved platform logos */
.st-logo{display:inline-flex !important;align-items:center}
.st-logo img{display:block;height:clamp(64px,6vw,92px);width:auto;max-width:100%}
.pc-logo{display:block;background:#fff;border-radius:6cqw;padding:4cqw 5cqw;box-shadow:0 8px 20px -12px rgba(0,0,0,.45)}
.pc-logo img{display:block;width:100%;height:auto}

.site button.btn-ghost-dark{background:transparent}

/* controls */
.st-controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;margin:clamp(14px,2vh,22px) auto 0;width:min(100%,1360px)}
.st-tabs{display:flex;gap:4px;padding:5px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.st-tab{position:relative;display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 14px;border:0;border-radius:12px;background:transparent;color:#B9C7D8;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;overflow:hidden;transition:background .3s,color .3s}
.st-tab:hover{color:#fff;background:rgba(255,255,255,.05)}
.st-tab[aria-current="step"]{background:#fff;color:#143256}
.st-tab .sw{width:12px;height:12px;border-radius:4px;flex:none}
.st-tab .prog{position:absolute;inset-inline-start:0;bottom:0;height:3px;width:0;background:var(--pg,#1256A2);animation:st-prog var(--dur,7s) linear forwards}
@keyframes st-prog{to{width:100%}}
.st-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:48px;min-height:48px;padding:0 14px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.st-btn:hover{background:rgba(255,255,255,.07)}
.st-btn:disabled{opacity:.35;cursor:default}
.st-count{font-family:"Montserrat",sans-serif;font-size:13px;color:#8EA3BC;min-width:52px;text-align:center}

/* narrow screens: visual area keeps a 4:3 composition, text flows below it */
@media (max-width:1099px),(max-height:639px){
  .stage{width:100%;aspect-ratio:auto}
  .stage-visual{position:relative;aspect-ratio:4/3;width:100%}
  .stage-text{margin:18px 0 0 0 !important;width:auto !important;padding-bottom:8px}
  .st-logo img{height:clamp(52px,14vw,72px)}
  .st-h{font-size:clamp(28px,7vw,44px)}
  .st-h.xl{font-size:clamp(32px,8vw,52px)}
  .st-tab .lbl{display:none}
  .st-tab{padding:0 12px}
  .st-tab[aria-current="step"] .lbl{display:inline}

.orb-spin svg{display:block;width:100%;height:100%;overflow:visible}
.orb-spin .q{transform-box:fill-box;transform-origin:center;transition:opacity .5s ease .95s,transform .6s cubic-bezier(.2,.7,.2,1) .95s,filter .5s ease .95s}
.orbit:not(.all) .orb-spin .q{opacity:.16;filter:grayscale(.6)}
.orbit[data-focus="academy"] .q-academy,.orbit[data-focus="medical"] .q-medical,.orbit[data-focus="career"] .q-career,.orbit[data-focus="research"] .q-research{opacity:1!important;filter:none!important;transform:scale(1.1)}
.orb-names{position:absolute;left:29%;top:60%;width:42%;height:26%}
.orb-wm{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;opacity:0;transform:translateY(10px) scale(.96);transition:opacity .35s ease,transform .35s ease}
.orb-wm.on{opacity:1;transform:none;transition:opacity .6s ease 1.05s,transform .7s cubic-bezier(.2,.7,.2,1) 1.05s}
.orb-wm svg{display:block;width:100%;height:auto;max-height:100%}
@media (prefers-reduced-motion:reduce){.orb-spin,.orb-spin .q,.orb-wm,.orb-wm.on,.orb-st{transition:none!important}}

/* ===== platform card beside the orbit (16 Oct 2026) ===== */
.pp-card{position:relative;display:flex;flex-direction:column;gap:clamp(10px,1.1vw,14px);padding:clamp(16px,1.6vw,22px);border-radius:28px;background:var(--pc);color:var(--pt);box-shadow:0 30px 60px -34px color-mix(in srgb,var(--pc) 75%,#000),0 0 0 8px color-mix(in srgb,var(--pc) 12%,transparent);overflow:hidden;opacity:0;transform:translateY(18px) scale(.97);transition:opacity .45s ease,transform .45s ease}
.spanel.on .pp-card{opacity:1;transform:none;transition:opacity .7s ease .55s,transform .8s cubic-bezier(.2,.7,.2,1) .55s}
.pp-card::after{content:"";position:absolute;inset-inline-start:-80px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,0) 70%);pointer-events:none}
/* wide card: video tile on the left, tile pattern on the right */
.pp-card{max-width:540px;margin-inline:auto}
.pp-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(14px,1.6vw,22px);align-items:start;direction:ltr}
.pp-media{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:#06142A;box-shadow:0 14px 30px -18px rgba(0,0,0,.55)}
.pp-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pp-media.empty{background:color-mix(in srgb,#000 14%,var(--pc));display:grid;place-items:center;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pt) 18%,transparent)}
.pp-soon{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;text-align:center;font-size:13px;font-weight:600;color:var(--pt);opacity:.8}
.pp-soon svg{width:46px;height:46px;padding:12px;border-radius:50%;background:color-mix(in srgb,var(--pt) 16%,transparent)}
.pp-side{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.pp-pat{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:min(100%,132px)}
.pp-pat s{display:block;aspect-ratio:1/1;border-radius:24%;background:var(--pt);opacity:.22}
.pp-num{font:600 15px/1 "Montserrat",sans-serif;color:var(--pt);opacity:.85}
.pp-logo{align-self:flex-start;display:block;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 10px 24px -14px rgba(0,0,0,.45)}
.pp-logo img{display:block;height:clamp(44px,3.6vw,56px);width:auto}
.pp-tag{font-size:clamp(17px,1.4vw,20px);font-weight:700;line-height:1.4}
.pp-brief{margin:0;font-size:14px;line-height:1.75;opacity:.92;max-width:58ch}
.pp-actions{display:flex;flex-wrap:wrap;gap:10px;padding-top:4px}
.pp-actions .btn{min-height:48px;white-space:normal;text-align:center;line-height:1.3}
.pp-b1{background:#fff;color:#143256}
.pp-b1:hover{background:#F2F6FB;color:#143256}
.pp-b2{background:transparent;color:var(--pt);border-color:color-mix(in srgb,var(--pt) 45%,transparent)}
.pp-b2:hover{background:color-mix(in srgb,var(--pt) 10%,transparent);color:var(--pt)}
.spanel.pp{gap:0}
@media (max-width:760px){.pp-card{border-radius:22px}}
@media (prefers-reduced-motion:reduce){.pp-card,.spanel.on .pp-card{transition:none!important;opacity:1;transform:none}}

/* ===== faded tiles of the other platforms beside the card (16 Oct 2026) ===== */
.spanel.pp{flex-direction:row;align-items:center;gap:clamp(12px,1.4vw,20px);direction:ltr}
.site[dir="ltr"] .spanel.pp{flex-direction:row-reverse}
.spanel.pp .pp-card{flex:1;min-width:0;max-width:450px;margin:0}
.pp-minis{flex:none;width:clamp(62px,6vw,88px);display:flex;flex-direction:column;gap:clamp(10px,1.2vw,16px)}
.pp-mini{aspect-ratio:3/4;border:0;padding:14% 12%;border-radius:14px;background:var(--pc);cursor:pointer;display:flex;align-items:flex-start;justify-content:center;opacity:0;transform:translateX(-14px) scale(.94);transition:opacity .4s ease,transform .4s ease}
.site[dir="ltr"] .pp-mini{transform:translateX(14px) scale(.94)}
.spanel.on .pp-mini{opacity:.55;transform:none;transition:opacity .6s ease calc(.75s + var(--n) * .12s),transform .7s cubic-bezier(.2,.7,.2,1) calc(.75s + var(--n) * .12s)}
.spanel.on .pp-mini:hover{opacity:.95;transition-delay:0s}
.pp-mini:focus-visible{outline:3px solid #143256;outline-offset:3px;opacity:1}
.pp-mpat{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;direction:ltr}
.pp-mpat s{display:block;aspect-ratio:1/1;border-radius:24%;background:var(--pt);opacity:.28}
.pp-mpat s.off{visibility:hidden}
@media (max-width:1099px),(max-height:639px){
  .spanel.pp,.site[dir="ltr"] .spanel.pp{flex-direction:column;align-items:stretch}
  .pp-minis{width:auto;flex-direction:row;justify-content:center;gap:10px}
  .pp-mini{width:46px;aspect-ratio:3/4;flex:none;padding:7px 6px;border-radius:10px}
  .pp-mpat{gap:2px}
  .spanel.pp .pp-card{max-width:none}
}
@media (prefers-reduced-motion:reduce){.pp-mini,.spanel.on .pp-mini{transition:none!important}.spanel.on .pp-mini{opacity:.55}}

/* ===== shared platform stage: next tile grows into the card (16 Oct 2026) ===== */
.pp-cards{display:grid;flex:1;min-width:0;max-width:450px}
#pp-stage .pp-card{grid-area:1/1;max-width:none;margin:0;opacity:0;visibility:hidden;transform:scale(.94);transition:opacity .45s ease,transform .9s cubic-bezier(.65,0,.35,1),visibility 0s linear .45s}
#pp-stage .pp-card.on{opacity:1;visibility:visible;transform:none;transition:opacity .5s ease,transform .9s cubic-bezier(.65,0,.35,1),visibility 0s}
#pp-stage .pp-card.out{visibility:visible;opacity:0;transform:scale(.9);transition:opacity .45s ease,transform .6s ease,visibility 0s linear .45s}
.pp-inner{display:flex;flex-direction:column;gap:clamp(10px,1.1vw,14px);transition:opacity .45s ease .55s}
#pp-stage .pp-card.growing .pp-inner{opacity:0;transition:none}
#pp-stage .pp-card.on:not(.growing) .pp-inner{opacity:1}
@keyframes pp-mini-in{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:.55;transform:none}}
#pp-stage .pp-mini{opacity:.55;transform:none;transition:opacity .25s ease;animation:pp-mini-in .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.35s + var(--n) * .14s)}
#pp-stage .pp-mini:hover{opacity:.95}
#pp-stage:not(.on){visibility:hidden}
#pp-stage.on{visibility:visible}
@media (prefers-reduced-motion:reduce){#pp-stage .pp-mini{animation:none}#pp-stage .pp-card,#pp-stage .pp-card.on{transition:none!important}}

/* section B: real 16:10 platform videos inside the browser frame */
.vid.has-video.wide{max-width:none;background:#fff}
.vid.has-video.wide .v-screen{aspect-ratio:16/10;background:#F3F6FA}
.vid.has-video.wide .v-ctrl{background:linear-gradient(0deg,rgba(255,255,255,.92),rgba(255,255,255,0))}
.vid.has-video.wide .v-play{background:rgba(255,255,255,.95)}
.vid.has-video.wide .v-prog-bar{background:color-mix(in srgb,var(--pc) 18%,transparent)}
@media (max-width:760px){.vid.has-video.wide .v-ctrl{background:#F7F9FC}}

/* hero background image built from the four platforms (16 Oct 2026); mirrored on the English page */
.stage-sec.stage-white{background:#fff;position:relative;isolation:isolate}
.stage-sec.stage-white::before{content:"";position:absolute;inset:0;z-index:-1;background:url("MCI-Group-Website-media/mci-hero-bg.webp") center/cover no-repeat}
.site[dir="ltr"] .stage-sec.stage-white::before{transform:scaleX(-1)}
/* keep the inside of the circle clean: the background tiles stop at the ring (16 Oct 2026) */
.orb-ring{background:radial-gradient(circle,#FFFFFF 0%,#FFFFFF 70%,rgba(255,255,255,.94) 100%)}

html{color-scheme:light}
body{margin:0;background:#fff}
#top{color:#143256;background:#fff}

/* ---------- presentation stage: moves existing elements so CSS transitions run ---------- */
function updateStage() {
  const i = ix(), rtl = !i, s = S(), step = st.step;
  const M = st.narrow ? L.narrow : L.wide;
  const mir = (b, keep) => (rtl && !keep ? Object.assign({}, b, { l: 100 - b.l - b.w }) : b);
  const box = (b, extra) => 'left:' + b.l + '%;top:' + b.t + '%;width:' + b.w + '%;' + (extra || '');
  const focusKey = step >= 1 && step <= LAST ? HERO[step - 1] : null;

  updateOrbit(step);

  let textStyle = '';
  if (!st.narrow) {
    const t2 = mir(M.intro.text, false);
    textStyle = 'margin-left:' + t2.l + '%;margin-top:' + (12 * 9 / 16).toFixed(3) + '%;width:' + t2.w + '%;';
  }
  $('.stage-text').style.cssText = textStyle;

  $$('[data-panel]').forEach(el => {
    const n = Number(el.getAttribute('data-panel'));
    el.classList.toggle('on', n === step);
    el.setAttribute('aria-hidden', String(n !== step));
    if ('inert' in el) el.inert = n !== step;
  });
  updatePP(step);

  $$('.st-tab').forEach(el => {
    const n = Number(el.getAttribute('data-tab'));
    el.setAttribute('aria-current', n === step ? 'step' : 'false');
  });
  $('#st-prev').disabled = step === 0;
  $('#st-next').disabled = false;
  const play = $('#st-play');
  play.setAttribute('aria-pressed', String(st.playing));
  play.innerHTML = (st.playing
    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>'
    : '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="' + (rtl ? 'M17 5v14L6 12z' : 'M7 5v14l11-7z') + '"></path></svg>') +
    '<span>' + esc(st.playing ? s.pause : s.play) + '</span>';
  $('#st-count').textContent = (step + 1) + ' / ' + (LAST + 1);
  const labels = [s.groupTab].concat(HERO.map(k => PL[k].name[i]));
  $('#st-announce').textContent = (i ? 'Step ' : 'الخطوة ') + (step + 1) + (i ? ' of ' : ' من ') + (LAST + 1) + ': ' + labels[step];
}

function setStage(patch) {
  const before = st.step + '|' + st.playing;
  Object.assign(st, patch);
  if (before !== st.step + '|' + st.playing) updateStage();
}

/* ---------- observers: autoplay while visible, chapter reveals, active nav ---------- */
let sio, io, navIO;
function observe() {
  [sio, io, navIO].forEach(o => o && o.disconnect());
  if (typeof IntersectionObserver === 'undefined') return;
  sio = new IntersectionObserver((es) => {
    const vis = es.some(e => e.isIntersecting);
    st.stageVisible = vis;
    if (vis && !st.userStopped && OPTS.autoplay) setStage({ playing: true });
    if (!vis && st.playing) setStage({ playing: false });
  }, { threshold: 0.25 });
  sio.observe($('#mci-stage'));
  if (st.anim) {
    io = new IntersectionObserver((es) => {
      es.forEach(e => { if (e.isIntersecting) { const k = e.target.getAttribute('data-chap'); st.seen[k] = 'in'; e.target.classList.add('in'); } });
    }, { threshold: 0.1, rootMargin: '0px 0px -8% 0px' });
    $$('[data-chap]').forEach(el => io.observe(el));
  }
  navIO = new IntersectionObserver((es) => {
    es.forEach(e => { if (e.isIntersecting) { const k = e.target.getAttribute('data-nav'); if (k !== st.active) { st.active = k; updateNav(); } } });
  }, { rootMargin: '-45% 0px -50% 0px' });
  $$('[data-nav]').forEach(el => navIO.observe(el));
}

/* ---------- preview player ---------- */
const players = {};
let vidIO, glIO;
const smallScreen = () => { try { return window.matchMedia('(max-width: 760px)').matches; } catch (e) { return false; } };
function initVideos() {
  Object.keys(players).forEach(k => cancelAnimationFrame(players[k].raf));
  [vidIO, glIO].forEach(o => o && o.disconnect());
  $$('.vid').forEach(el => {
    const k = el.getAttribute('data-vid');
    players[k] = { el, k, t: 0, playing: false, visible: false, userPaused: false, userStarted: false, last: 0, scene: -1, raf: 0, video: el.querySelector('video') };
    renderPlayer(players[k]);
    if (!players[k].video) setScene(players[k], 0);
    else players[k].video.addEventListener('loadedmetadata', function () { if (!players[k].playing && this.currentTime === 0) this.currentTime = 2; }, { once: true });
  });
  if (typeof IntersectionObserver === 'undefined') return;
  vidIO = new IntersectionObserver((es) => es.forEach(e => {
    const p = players[e.target.getAttribute('data-vid')]; if (!p) return;
    p.visible = e.isIntersecting;
    const auto = !st.reduced && !smallScreen();
    if (p.visible && !p.userPaused && (auto || p.userStarted)) playVid(p);
    if (!p.visible) pauseVid(p);
  }), { threshold: 0.5 });
  $$('.vid').forEach(el => vidIO.observe(el));
  glIO = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) { countUp(e.target); glIO.unobserve(e.target); } }), { threshold: 0.6 });
  $$('.gl-v[data-to]').forEach(el => glIO.observe(el));
}
function setScene(p, n) {
  if (p.scene === n) return;
  p.scene = n;
  p.el.querySelectorAll('.v-scene').forEach(s => s.classList.toggle('on', Number(s.getAttribute('data-scene')) === n));
  const sc = p.el.querySelector('.v-scene[data-scene="' + n + '"]');
  if (sc) sc.querySelectorAll('.v-num[data-to]').forEach(countUp);
}
function countUp(el) {
  const to = Number(el.getAttribute('data-to')), suf = el.getAttribute('data-suffix') || '';
  if (st.reduced) { el.textContent = to + suf; return; }
  const t0 = performance.now(), d = 1100;
  const step = (now) => { const f = Math.min(1, (now - t0) / d), e = 1 - Math.pow(1 - f, 3); el.textContent = Math.round(to * e) + suf; if (f < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function tick(p, now) {
  if (!p.playing) return;
  if (p.video) {
    const d = p.video.duration || 1; p.t = p.video.currentTime;
    p.el.querySelector('.v-prog-bar i').style.transform = 'scaleX(' + (p.t / d).toFixed(4) + ')';
    p.raf = requestAnimationFrame(n => tick(p, n)); return;
  }
  p.t = (p.t + (now - p.last) / 1000) % VID_SECONDS; p.last = now;
  setScene(p, Math.floor(p.t / (VID_SECONDS / 3)));
  p.el.querySelector('.v-prog-bar i').style.transform = 'scaleX(' + (p.t / VID_SECONDS).toFixed(4) + ')';
  p.raf = requestAnimationFrame(n => tick(p, n));
}
function playVid(p) { if (p.playing) return; if (p.video) { const pr = p.video.play(); if (pr && pr.catch) pr.catch(() => { p.playing = false; p.el.classList.remove('playing'); cancelAnimationFrame(p.raf); renderPlayer(p); }); } p.playing = true; p.el.classList.add('playing'); p.last = performance.now(); p.raf = requestAnimationFrame(n => tick(p, n)); renderPlayer(p); }
function pauseVid(p) { if (!p.playing) return; if (p.video) p.video.pause(); p.playing = false; p.el.classList.remove('playing'); cancelAnimationFrame(p.raf); renderPlayer(p); }
function renderPlayer(p) {
  const b = p.el.querySelector('.v-play');
  b.setAttribute('aria-label', xs(p.playing ? 'pause' : 'play'));
  b.innerHTML = p.playing
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l11-7z"></path></svg><span>' + esc(xs('play')) + '</span>';
  p.el.classList.toggle('idle', !p.playing && p.t === 0);
}
root.addEventListener('click', (e) => {
  const b = e.target.closest('[data-vplay]');
  if (b) {
    const p = players[b.getAttribute('data-vplay')];
    if (p.playing) { p.userPaused = true; pauseVid(p); } else { p.userPaused = false; p.userStarted = true; playVid(p); }
    return;
  }
  const x = e.target.closest('[data-explore]');
  if (x) {
    const m = $('#more-' + x.getAttribute('data-explore'));
    m.hidden = !m.hidden; x.setAttribute('aria-expanded', String(!m.hidden));
  }
});

999999999999 78.66 -4.2Q78.66 -3.3 78.345 -2.535Q78.03 -1.77 77.475 -1.2Q76.91999999999999 -0.63 76.16999999999999 -0.315Q75.41999999999999 0.0 74.52 0.0H65.19ZM72.36 -7.29 69.17999999999999 -4.62 69.21 -4.5H75.36ZM64.8 -22.17H66.06L66.09 -22.32Q65.49 -22.979999999999997 65.49 -23.909999999999997Q65.49 -25.17 66.405 -25.995Q67.32 -26.82 68.76 -26.82Q69.63 -26.82 70.44 -26.46Q71.25 -26.1 71.85 -25.47L70.41 -23.46Q69.69 -24.18 68.76 -24.18Q68.25 -24.18 67.935 -23.939999999999998Q67.62 -23.7 67.62 -23.369999999999997Q67.62 -22.38 69.69 -22.38H71.91V-19.74H64.8Z M81.50999999999999 -22.2H85.11V0.0H81.50999999999999Z\" fill=\"#F89A1C\"></path></svg>"};
/* clockwise from 12 o'clock; matches each platform's quadrant in the mark */
const ORB_ANGLE = { academy: -45, medical: 45, research: 135, career: 225 };
const orbState = { spin: 0, arm: 0, step: -1 };

function orbitMarkup(lang, i) {
  orbState.spin = 0; orbState.arm = 0; orbState.step = -1;
  const R = 46; /* ring radius, % of the orbit box */
  const stations = ORDER.map(k => {
    const a = ORB_ANGLE[k] * Math.PI / 180;
    const x = 50 + R * Math.sin(a), y = 50 - R * Math.cos(a);
    return '<button type="button" class="orb-st" data-orb="' + k + '" style="left:' + x.toFixed(2) + '%;top:' + y.toFixed(2) + '%;--pc:' + PL[k].color + '" aria-label="' + esc(PL[k].name[i]) + '"><span></span></button>';
  }).join('');
  const wms = ['group'].concat(ORDER).map(k => '<span class="orb-wm" data-wm="' + k + '">' + ORB[k + '-' + lang] + '</span>').join('');
  return '<div class="orbit" data-focus="group">' +
    '<span class="orb-ring" aria-hidden="true"></span>' +
    '<span class="orb-arm" aria-hidden="true"><i></i></span>' +
    stations +
    '<div class="orb-mark" aria-hidden="true"><div class="orb-spin">' + ORB.icon + '</div></div>' +
    '<div class="orb-names" role="img" aria-label="' + esc(i ? 'MCI Group' : 'مجموعة MCI') + '">' + wms + '</div>' +
  '</div>';
}

function updateOrbit(step) {
  const el = $('.orbit'); if (!el) return;
  const M = st.narrow ? { l: 19, w: 62, A: 4 / 3 } : { l: 52, w: 42, A: 16 / 9 };
  const l = st.lang === 'en' ? M.l : 100 - M.l - M.w;
  const h = M.w * M.A;
  el.style.cssText = 'left:' + l + '%;top:' + ((100 - h) / 2).toFixed(2) + '%;width:' + M.w + '%;';

  const key = step >= 1 && step <= LAST ? HERO[step - 1] : 'group';
  if (orbState.step !== step) {
    /* every switch: the mark makes one full turn and stops upright */
    if (orbState.step !== -1) orbState.spin += 360;
    orbState.step = step;
  }
  el.setAttribute('data-focus', key);
  el.classList.toggle('all', key === 'group');
  el.querySelector('.orb-spin').style.transform = 'rotate(' + orbState.spin + 'deg)';
  el.querySelectorAll('.orb-wm').forEach(w => w.classList.toggle('on', w.getAttribute('data-wm') === key));
  el.querySelectorAll('.orb-st').forEach(b => { const on = b.getAttribute('data-orb') === key; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
  const names = el.querySelector('.orb-names');
  names.setAttribute('aria-label', key === 'group' ? (st.lang === 'en' ? 'MCI Group' : 'مجموعة MCI') : PL[key].name[ix()]);
}

/* the dot is the step timer: during each step it travels a quarter turn from the current platform
   to the next one, wearing the colour of the platform it is heading to; arriving switches the step */
const clock = { step: -1, elapsed: 0, last: 0 };
function orbFrame(now) {
  const dt = clock.last ? Math.min(now - clock.last, 100) : 0; clock.last = now;
  if (clock.step !== st.step) { clock.step = st.step; clock.elapsed = 0; }
  if (st.playing) clock.elapsed += dt;
  const d = dur();
  if (clock.elapsed >= d) {
    setStage({ step: st.step >= LAST ? 1 : st.step + 1 }); /* after Career the loop returns to Academy */
    clock.step = st.step; clock.elapsed = 0;
  }
  const arm = $('.orb-arm');
  if (arm) {
    const from = st.step === 0 ? 225 : ORB_ANGLE[HERO[st.step - 1]];
    const next = HERO[st.step % LAST];
    arm.style.transform = 'rotate(' + (from + 90 * Math.min(1, clock.elapsed / d)).toFixed(2) + 'deg)';
    arm.style.setProperty('--dc', PL[next].color);
  }
  requestAnimationFrame(orbFrame);
}
requestAnimationFrame(orbFrame);

/* ---------- platform card stage: the waiting tile of the next platform grows forward into the card,
   the current card fades back and rejoins the queue at the end ---------- */
function updatePP(step) {
  const stage = $('#pp-stage'); if (!stage) return;
  const key = step >= 1 && step <= LAST ? HERO[step - 1] : null;
  const wasOn = stage.classList.contains('on');
  stage.classList.toggle('on', !!key);
  stage.setAttribute('aria-hidden', String(!key));
  if ('inert' in stage) stage.inert = !key;
  const cards = [...stage.querySelectorAll('.pp-card')];
  const prev = stage.dataset.key || '';
  if (key === prev) { playPP(stage, key, false); return; }
  stage.dataset.key = key || '';
  /* where the growing card starts: its waiting tile, if it is on screen */
  const tile = stage.querySelector('.pp-mini[data-orb="' + key + '"]');
  const from = key && wasOn && tile && !st.reduced ? tile.getBoundingClientRect() : null;
  cards.forEach(c => {
    const on = c.dataset.pp === key;
    if (on) { c.classList.remove('out'); c.classList.add('on'); }
    else if (c.classList.contains('on')) { c.classList.remove('on'); c.classList.add('out'); setTimeout(() => c.classList.remove('out'), 700); }
  });
  /* the queue: the platforms that come next, in order */
  if (key) {
    const order = [1, 2, 3].map(j => HERO[(step - 1 + j) % LAST]);
    $('#pp-minis').innerHTML = order.map((x, n) => '<button type="button" class="pp-mini" data-orb="' + x + '" style="--pc:' + PL[x].color + ';--pt:' + PL[x].text + ';--n:' + n + '" aria-label="' + esc(PL[x].name[ix()]) + '"><span class="pp-mpat" aria-hidden="true">' + QUAD[x].map(v => '<s class="' + (v ? '' : 'off') + '"></s>').join('') + '</span></button>').join('');
  }
  const card = key && stage.querySelector('.pp-card[data-pp="' + key + '"]');
  if (card && from) {
    const to = card.getBoundingClientRect();
    if (to.width && to.height) {
      card.classList.add('growing');
      card.style.transition = 'none';
      card.style.transformOrigin = '0 0';
      card.style.transform = 'translate(' + (from.left - to.left).toFixed(1) + 'px,' + (from.top - to.top).toFixed(1) + 'px) scale(' + (from.width / to.width).toFixed(4) + ',' + (from.height / to.height).toFixed(4) + ')';
      card.style.opacity = '.55';
      card.getBoundingClientRect();
      requestAnimationFrame(() => {
        card.style.transition = ''; card.style.transform = ''; card.style.opacity = '';
        setTimeout(() => { card.classList.remove('growing'); card.style.transformOrigin = ''; }, 950);
      });
    }
  }
  playPP(stage, key, true);
}
function playPP(stage, key, restart) {
  stage.querySelectorAll('.pp-card video').forEach(v => {
    const on = v.closest('.pp-card').dataset.pp === key && st.stageVisible !== false;
    if (on) { if (restart) { try { v.currentTime = 0; } catch (e) {} } const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); }
    else v.pause();
  });
}

build();
